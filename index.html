<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partner Wishlist</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <!-- Firebase config — loaded from gitignored file locally, Vercel env in prod -->
    <script src="firebase-config.js"></script>

    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, doc, onSnapshot, setDoc, arrayUnion, arrayRemove, deleteField, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const app = initializeApp(window.firebaseConfig);
      const db  = getFirestore(app);
      const wishlistDoc = doc(db, "wishlist", "shared");

      window._fbOnSnapshot = (cb, errCb) => onSnapshot(wishlistDoc, cb, errCb);

      // Every write below is a MERGE that touches only one field. The document is
      // never overwritten as a whole, so items added from another phone or tab at
      // the same moment are never lost.
      window._fbAddItem = (category, item) =>
        setDoc(wishlistDoc, { [category]: arrayUnion(item) }, { merge: true });

      // Changes one item's price. Runs as a transaction on the latest server copy,
      // so items added at the same moment from another device are kept.
      window._fbUpdateItemPrice = (category, item, price) =>
        runTransaction(db, async (tx) => {
          const snap = await tx.get(wishlistDoc);
          const list = snap.exists() && Array.isArray(snap.data()[category]) ? snap.data()[category] : [];
          const same = (a) => a.url === item.url && (a.addedAt ?? null) === (item.addedAt ?? null) && a.title === item.title;
          if (!list.some(same)) throw new Error("This item was changed or removed on another device.");
          const updated = list.map(a => same(a) ? { ...a, price: price || null } : a);
          tx.set(wishlistDoc, { [category]: updated }, { merge: true });
        });

      window._fbRemoveItem = (category, item) =>
        setDoc(wishlistDoc, { [category]: arrayRemove(item) }, { merge: true });

      window._fbAddCategory = (name) =>
        setDoc(wishlistDoc, { customCategories: arrayUnion(name) }, { merge: true });

      // Removes a category only if it is still empty when the delete runs. The
      // check and the delete happen inside one transaction, so an item added from
      // another device at the same moment can never be thrown away.
      window._fbRemoveCategory = (name) =>
        runTransaction(db, async (tx) => {
          const snap = await tx.get(wishlistDoc);
          const items = snap.exists() ? snap.data()[name] : undefined;
          if (Array.isArray(items) && items.length > 0) {
            throw new Error("This category has items now, so it was kept.");
          }
          tx.set(wishlistDoc, { customCategories: arrayRemove(name), [name]: deleteField() }, { merge: true });
        });
    </script>
    <style>
      /* --- Colour tokens (Req 4.1, 4.2, 4.3) --- */
      :root {
        --bg:       oklch(97% 0.01 280);
        --surface:  oklch(100% 0 0);
        --fg:       oklch(20% 0.02 280);
        --muted:    oklch(55% 0.02 280);
        --border:   oklch(88% 0.01 280);
        --accent:   oklch(55% 0.18 280);
        --accent-h: oklch(48% 0.20 280);
      }

      /* --- Reset & base --- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        padding: 2rem 1rem 4rem;
      }

      /* --- Centred column --- */
      .container {
        max-width: 960px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      /* --- Page title --- */
      .app-title {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--fg);
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .app-logo {
        width: 2.2rem;
        height: 2.2rem;
        object-fit: contain;
        border-radius: 6px;
      }

      /* --- Add form (Req 4.1 — above category sections) --- */
      .add-form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .url-input {
        flex: 1 1 260px;
        padding: 0.55rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        color: var(--fg);
        background: var(--bg);
        outline: none;
        transition: border-color 0.15s;
      }
      .url-input:focus { border-color: var(--accent); }

      .category-select {
        padding: 0.55rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.95rem;
        color: var(--fg);
        background: var(--bg);
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .category-select:focus { border-color: var(--accent); }

      .add-btn {
        padding: 0.55rem 1.25rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      .add-btn:hover { background: var(--accent-h); }

      /* --- Category section (Req 4.2) --- */
      .category-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
      }

      .category-heading {
        font-size: 1.05rem;

        letter-spacing: 0.06em;

        margin-bottom: 0.85rem;
      }

      .empty-state {

      }

      /* --- Loading / error banner --- */
      .status-banner {

        border-radius: 12px;
        padding: 1rem 1.5rem;

        color: oklch(40% 0.2 25);

      }
      .spinner {
        width: 1rem; height: 1rem;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;

      @keyframes spin { to { transform: rotate(360deg); } }

      /* --- Item list --- */
      .item-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;

      .item-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.6rem 0.9rem;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;

      .remove-btn {
        flex-shrink: 0;

      .remove-btn:hover { color: oklch(50% 0.2 20); border-color: oklch(50% 0.2 20); }

      /* --- Item link with hover state (Req 4.3) --- */
      .item-link {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--accent);
        text-decoration: none;
        transition: color 0.15s;
      }
      .item-link:hover { color: var(--accent-h); }

      .item-thumb {
        width: 72px;
        height: 72px;
        object-fit: contain;
        border-radius: 6px;
        flex-shrink: 0;
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .item-label {
        font-size: 0.9rem;
        word-break: break-word;
        text-decoration: none;
      }
      .item-text { display: flex; flex-direction: column; gap: 0.2rem; }
      .item-price {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--fg);
      }

      .price-input { flex: 0 1 130px; }

      .item-main { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
      .price-btn {
        align-self: flex-start;
        margin-left: calc(72px + 0.75rem);
        background: none;
        border: 1px dashed transparent;
        border-radius: 6px;
        padding: 0.1rem 0.4rem;

        cursor: pointer;
      }

      .price-edit { display: flex; gap: 0.35rem; margin-left: calc(72px + 0.75rem); flex-wrap: wrap; }
      .price-edit-input {
        width: 110px;
        padding: 0.25rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 0.85rem;
        background: var(--surface);
      }

      .add-btn:disabled { opacity: 0.6; cursor: wait; }

      .form-note {
        flex-basis: 100%;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .form-note.error { color: oklch(45% 0.2 25); }

      .heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.85rem;
      }

      .ghost-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;

        cursor: pointer;
      }

      .item-link:hover .item-label {

        text-decoration-color: var(--accent-h);
      }
    </style>

  <body>
    <div id="root"></div>
    <script type="text/babel">
      // --- Constants & Data Model (Req 1.4) ---
      // Built in categories. Categories the user creates are stored in Firestore
      // under the "customCategories" field of the same wishlist/shared document.
      const DEFAULT_CATEGORIES = ['Bags', 'Kurta', 'Sarees', 'Gowns', 'Tshirt', 'Shirt', 'Watch', 'Skirt', 'Shoes', 'Accessories'];
      const RESERVED_FIELDS = ['customCategories'];
      const NEW_CATEGORY_OPTION = '__new__';

      // Works out the full list of categories to show. Any array field found in
      // the document is shown too, so no stored item can ever become invisible.
      function getCategories(data) {
        const custom = Array.isArray(data.customCategories)
          ? data.customCategories.filter(c => typeof c === 'string')
          : [];
        const extra = Object.keys(data).filter(k =>
          !RESERVED_FIELDS.includes(k) && Array.isArray(data[k]));
        const all = [];
        [...DEFAULT_CATEGORIES, ...custom, ...extra].forEach(c => {
          if (!all.includes(c)) all.push(c);
        });
        return all;
      }

      function cleanUrl(raw) {
        try {
          const u = new URL(raw);
          ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id',
           'fbclid','ad_id','campaign_id','media_type','variant'].forEach(p => u.searchParams.delete(p));
          [...u.searchParams.keys()].forEach(k => {
            if (k.startsWith('utm') || k.startsWith('fb')) u.searchParams.delete(k);
          });
          return u.toString();
        } catch(_) { return raw; }
      }

      // --- Price helpers ---
      function formatPrice(amount, currency) {
        const num = Number(String(amount).replace(/[^0-9.]/g, ''));
        if (!amount || !isFinite(num) || num <= 0) return null;
        const cur = (currency || 'INR').toUpperCase();
        try {
          return new Intl.NumberFormat('en-IN', { style: 'currency', currency: cur, maximumFractionDigits: 2 }).format(num);
        } catch(_) {
          return `${cur} ${num}`;
        }
      }

      // Looks for a price written in plain text, such as "Rs. 1,299" or "₹999".
      function findPriceInText(text) {
        if (!text) return null;
        const m = String(text).match(/(₹|Rs\.?|INR|\$|USD)\s?([0-9][0-9,]*(?:\.[0-9]{1,2})?)/i);
        if (!m) return null;
        const sym = m[1].toUpperCase();
        const cur = sym === '$' || sym === 'USD' ? 'USD' : 'INR';
        return formatPrice(m[2], cur);
      }

      // Fetches name, image and price for a product link.
      // 1. Our own Vercel function (/api/preview) fetches the page directly and
      //    understands Amazon, Flipkart and Myntra pages.
      // 2. microlink fills in anything still missing.
      // Same cleanup the server does, applied to microlink titles too.
      function cleanTitle(title) {
        if (!title) return null;
        let t = String(title).replace(/\s+/g, ' ').trim();
        t = t
          .replace(/^Amazon\.[a-z.]+\s*:\s*/i, '')
          .replace(/\s*:\s*Amazon\.[a-z.]+.*$/i, '')
          .replace(/\s*[|\-–]\s*(Buy\s.*)?(Online\s)?(at\s)?(Low|Best)\s+Prices?\s+in\s+India.*$/i, '')
          .replace(/\s+Online at (Low|Best) Prices? in India.*$/i, '')
          .replace(/\s*[|\-–]\s*(Flipkart|Myntra|Amazon|Nykaa|Ajio|Meesho|Tata\s?CLiQ)(\.com|\.in)?\s*$/i, '')
          .replace(/\s*\|\s*Reviews?\s*&\s*Ratings.*$/i, '')
          .replace(/\s+[-–|]\s+Buy\s.*$/i, '')
          .replace(/^Buy\s+/i, '')
          .replace(/\s+\d{6,}(?=\s|$)/g, '')
          .replace(/\s+[-–]\s+[A-Za-z &]+\s+for\s+(Men|Women|Boys|Girls|Kids|Unisex)(\s+\d+)?\s*$/i, '')
          .replace(/\s*[|\-–:]\s*$/, '')
          .trim();
        if (t.length > 110) t = t.slice(0, 110).replace(/\s+\S*$/, '') + '…';
        // Titles that are only the shop name are useless as a product name.
        if (/^(amazon|flipkart|myntra|nykaa|ajio|meesho)(\.[a-z.]+)?$/i.test(t)) return null;
        if (/^(site maintenance|access denied|robot check|just a moment)/i.test(t)) return null;
        return t || null;
      }

      // Pulls the link out of whatever was pasted: a bare link, a link without
      // https://, or a whole share message from a shopping app.
      function extractLink(text) {
        if (!text) return null;
        const t = String(text).trim();
        const m = t.match(/https?:\/\/[^\s<>"']+/i);
        if (m) return m[0].replace(/[),.;!?]+$/, '');
        const bare = t.match(/(?:^|\s)((?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+\/[^\s<>"']*)/i);
        if (bare) return 'https://' + bare[1].replace(/[),.;!?]+$/, '');
        return null;
      }

      // Builds a readable name from the link when the shop shares nothing.
      function nameFromUrl(raw) {
        let u;
        try { u = new URL(raw); } catch (_) { return null; }
        const parts = u.pathname.split('/').map(p => { try { return decodeURIComponent(p); } catch(_) { return p; } }).filter(Boolean);
        const words = parts
          .filter(p => /[a-z]/i.test(p) && /[-_]/.test(p))
          .filter(p => !/^(dp|gp|p|buy|product|products|itm[0-9a-f]+)$/i.test(p));
        if (!words.length) return null;
        const best = words.sort((a, b) => b.length - a.length)[0];
        const name = best.replace(/[-_]+/g, ' ').replace(/\b\d{6,}\b/g, '').replace(/\s+/g, ' ').trim()
          .replace(/\b\w/g, c => c.toUpperCase());
        return name.length >= 4 ? name : null;
      }

      async function fetchProductDetails(url) {
        const own = await fetchFromOwnPreview(url);
        if (own.title && own.img && own.price) return own;
        const ml = await fetchFromMicrolink(own.finalUrl || url);
        return {
          finalUrl: own.finalUrl,
          // A real page title beats a name built from the link.
          title: (own.img || own.price ? own.title : null) || ml.title || own.title || nameFromUrl(own.finalUrl || ''),
          img: own.img || ml.img,
          price: own.price || ml.price,
        };
      }

      async function fetchFromOwnPreview(url) {
        const details = { title: null, img: null, price: null };
        try {
          const r = await fetch(`/api/preview?url=${encodeURIComponent(url)}`);
          if (!r.ok) return details;
          const d = await r.json();
          // Even when the shop blocked the page, the server still sends a name
          // built from the real product address (share links unwrapped).
          details.title = cleanTitle(d.title);
          details.finalUrl = d.finalUrl || null;
          if (!d.ok) return details;
          details.img = d.image || null;
          details.price = d.price ? formatPrice(d.price, d.currency) : null;
        } catch(_) {}
        return details;
      }

      async function fetchFromMicrolink(url) {
        const details = { title: null, img: null, price: null };
        const priceSel = 'meta[property="product:price:amount"],meta[property="og:price:amount"],meta[itemprop="price"],[itemprop="price"]';
        const curSel = 'meta[property="product:price:currency"],meta[property="og:price:currency"],meta[itemprop="priceCurrency"],[itemprop="priceCurrency"]';
        const qs = new URLSearchParams({
          url,
          'data.price.selector': priceSel,
          'data.price.attr': 'content',
          'data.currency.selector': curSel,
          'data.currency.attr': 'content',
        });
        try {
          const r = await fetch(`https://api.microlink.io/?${qs.toString()}`);
          const json = await r.json();
          const d = json.data || {};
          if (d.title) details.title = cleanTitle(d.title);
          if (d.image?.url) details.img = d.image.url;
          details.price =
            formatPrice(d.price, d.currency) ||
            findPriceInText(d.description) ||
            findPriceInText(d.title);
        } catch(_) {}
        return details;
      }

      // --- ItemCard with OG image preview via microlink (Req 2.2) ---
      function PriceTag({ price, onSave }) {
        const [editing, setEditing] = React.useState(false);
        const [value, setValue] = React.useState(price || '');
        const [saving, setSaving] = React.useState(false);

        async function save(e) {
          e.preventDefault();
          setSaving(true);
          const v = value.trim();
          const formatted = v ? (findPriceInText(v) || formatPrice(v, 'INR') || v) : null;
          const ok = await onSave(formatted);
          setSaving(false);
          if (ok) setEditing(false);
        }

        if (editing) {
          return (
            <form className="price-edit" onSubmit={save}>
              <input
                className="price-edit-input"
                value={value}
                onChange={e => setValue(e.target.value)}
                placeholder="e.g. 1299"
                inputMode="decimal"
                autoFocus
              />
              <button className="ghost-btn" type="submit" disabled={saving}>{saving ? '…' : 'Save'}</button>
              <button className="ghost-btn" type="button" onClick={() => { setEditing(false); setValue(price || ''); }}>Cancel</button>
            </form>
          );
        }
        return (
          <button className="price-btn" onClick={() => { setValue(price || ''); setEditing(true); }} title="Edit price">
            {price ? price : '+ Add price'}
          </button>
        );
      }

      function ItemLink({ url, title, img: storedImg, price }) {
        // derive favicon from url if no image was stored
        const fallback = React.useMemo(() => {
          try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }
          catch(_) { return null; }
        }, [url]);

        const imgSrc = storedImg || fallback;

        return (
          <a href={url} target="_blank" rel="noopener noreferrer" className="item-link">
            {imgSrc && <img src={imgSrc} alt={title} className="item-thumb" onError={e => { e.target.style.display='none'; }} />}
            <span className="item-text">
              <span className="item-label">{title || url}</span>
            </span>
          </a>
        );
      }

      // --- CategorySection (Req 2.1, 2.3) ---
      function CategorySection({ name, items = [], onRemove, onPriceChange, canDelete, onDeleteCategory }) {
        return (
          <section className="category-section">
            <div className="heading-row">
              <h2 className="category-heading">{name}</h2>
              {canDelete && items.length === 0 && (
                <button className="ghost-btn" onClick={onDeleteCategory} title="Delete this empty category">
                  Delete category
                </button>
              )}
            </div>
            {items.length === 0 ? (
              <p className="empty-state">No items yet.</p>
            ) : (
              <ul className="item-list">
                {items.map((item, i) => (
                  <li key={(item.url || '') + i} className="item-card">
                    <div className="item-main">
                      <ItemLink url={item.url} title={item.title} img={item.img} />
                      <PriceTag price={item.price} onSave={(p) => onPriceChange(item, p)} />
                    </div>
                    <button className="remove-btn" onClick={() => onRemove(item)} title="Remove">✕</button>
                  </li>
                ))}
              </ul>
            )}
          </section>
        );
      }

      // --- AddLinkForm (Req 1.1, 1.2, 1.3, 1.5) ---
      function AddLinkForm({ categories, onAddLink, onAddCategory }) {
        const [url, setUrl] = React.useState('');
        const [price, setPrice] = React.useState('');
        const [category, setCategory] = React.useState(categories[0]);
        const [newCat, setNewCat] = React.useState('');
        const [busy, setBusy] = React.useState(false);
        const [note, setNote] = React.useState({ text: '', error: false });

        const creating = category === NEW_CATEGORY_OPTION;

        async function handleSubmit(e) {
          e.preventDefault();
          if (busy) return;
          setNote({ text: '', error: false });

          let target = category;
          if (creating) {
            const res = await onAddCategory(newCat);
            if (!res.ok) { setNote({ text: res.message, error: true }); return; }
            target = res.name;
            setCategory(res.name);
            setNewCat('');
            if (!url.trim()) { setNote({ text: `Category "${res.name}" added.`, error: false }); return; }
          }

          if (!url.trim()) return; // Req 1.3 — empty URL: do nothing
          const link = extractLink(url);
          if (!link) { setNote({ text: 'That does not look like a product link.', error: true }); return; }
          setBusy(true);
          setNote({ text: 'Fetching product name, image and price…', error: false });
          const res = await onAddLink({ url: link, category: target, manualPrice: price.trim() });
          setBusy(false);
          setNote({ text: res.message, error: !res.ok });
          if (res.ok) { setUrl(''); setPrice(''); } // Req 1.5 — clear URL, keep category
        }

        return (
          <form className="add-form" onSubmit={handleSubmit}>
            <input
              type="text"
              inputMode="url"
              className="url-input"
              placeholder="Paste product link or share message…"
              value={url}
              onChange={e => setUrl(e.target.value)}
            />
            <input
              type="text"
              className="url-input price-input"
              placeholder="Price (optional)"
              value={price}
              onChange={e => setPrice(e.target.value)}
            />
            <select
              className="category-select"
              value={category}
              onChange={e => setCategory(e.target.value)}
            >
              {categories.map(cat => (
                <option key={cat} value={cat}>{cat}</option>
              ))}
              <option value={NEW_CATEGORY_OPTION}>+ New category…</option>
            </select>
            {creating && (
              <input
                type="text"
                className="url-input"
                placeholder="New category name"
                maxLength={40}
                value={newCat}
                onChange={e => setNewCat(e.target.value)}
                autoFocus
              />
            )}
            <button type="submit" className="add-btn" disabled={busy}>
              {busy ? 'Adding…' : 'Add'}
            </button>
            {note.text && <p className={`form-note ${note.error ? 'error' : ''}`}>{note.text}</p>}
          </form>
        );
      }

      // --- App root (Req 2.4, 4.1) ---
      function App() {
        const [data, setData] = React.useState({});
        const [loadState, setLoadState] = React.useState('loading'); // 'loading' | 'ok' | 'error'
        const [errorMsg, setErrorMsg] = React.useState('');

        // Firestore is the single source of truth: the screen only shows what the
        // snapshot says. Changes are sent as small merges and come back through
        // the snapshot, so nothing is ever written from stale local state.
        React.useEffect(() => {
          const unsub = window._fbOnSnapshot(
            snapshot => {
              setLoadState('ok');
              setData(snapshot.exists() ? snapshot.data() : {});
            },
            err => {
              // Firestore read failed (e.g. security rules blocking access)
              console.error('Firestore error:', err);
              setLoadState('error');
              setErrorMsg(err.message || String(err));
            }
          );
          return unsub;
        }, []);

        const categories = getCategories(data);
        const customCategories = Array.isArray(data.customCategories) ? data.customCategories : [];

        async function addCategory(rawName) {
          const name = rawName.trim().replace(/\s+/g, ' ');
          if (!name) return { ok: false, message: 'Type a category name first.' };
          if (name.length > 40) return { ok: false, message: 'Keep the name under 40 characters.' };
          if (name.startsWith('__') || RESERVED_FIELDS.includes(name))
            return { ok: false, message: 'That name is not allowed, please pick another.' };
          const existing = categories.find(c => c.toLowerCase() === name.toLowerCase());
          if (existing) return { ok: true, name: existing }; // reuse it instead of duplicating
          try {
            await window._fbAddCategory(name);
            return { ok: true, name };
          } catch (err) {
            console.error(err);
            return { ok: false, message: 'Could not save the category: ' + (err.message || err) };
          }
        }

        async function deleteCategory(name) {
          const items = data[name];
          if (Array.isArray(items) && items.length > 0) return; // never delete a category with items
          try { await window._fbRemoveCategory(name); }
          catch (err) { console.error(err); alert('Could not delete the category: ' + (err.message || err)); }
        }

        async function addLink({ url, category, manualPrice }) {
          const clean = cleanUrl(url);
          const list = Array.isArray(data[category]) ? data[category] : [];
          if (list.some(it => cleanUrl(it.url) === clean))
            return { ok: false, message: 'That link is already in ' + category + '.' };

          let img = null;
          try { img = `https://www.google.com/s2/favicons?domain=${new URL(clean).hostname}&sz=64`; } catch(_) {}

          const details = await fetchProductDetails(clean);
          const price = manualPrice
            ? (findPriceInText(manualPrice) || formatPrice(manualPrice, 'INR') || manualPrice)
            : details.price;

          // Firestore rejects undefined, so every field is a real value or null.
          const item = {
            url,
            title: details.title || nameFromUrl(clean) || clean,
            // Keep the original link, but remember the real product page too.
            ...(details.finalUrl && details.finalUrl !== url ? { productUrl: details.finalUrl } : {}),
            img: details.img || img,
            price: price || null,
            addedAt: Date.now(),
          };

          try {
            await window._fbAddItem(category, item);
          } catch (err) {
            console.error(err);
            return { ok: false, message: 'Could not save the link: ' + (err.message || err) };
          }
          return {
            ok: true,
            message: item.price
              ? `Added to ${category}.`
              : `Added to ${category}. The shop did not share a price. Tap "+ Add price" on the item to add it.`,
          };
        }

        async function removeLink(category, item) {
          try { await window._fbRemoveItem(category, item); }
          catch (err) { console.error(err); alert('Could not remove the item: ' + (err.message || err)); }
        }

        async function changePrice(category, item, price) {
          try { await window._fbUpdateItemPrice(category, item, price); return true; }
          catch (err) { console.error(err); alert('Could not save the price: ' + (err.message || err)); return false; }
        }

        return (
          <div className="container">
            <h1 className="app-title">
              <img src="/logo.jpeg" alt="logo" className="app-logo" />
              Partner Wishlist
            </h1>
            {loadState === 'loading' && (
              <div className="status-banner">
                <div className="spinner" />
                Connecting to database…
              </div>
            )}
            {loadState === 'error' && (
              <div className="status-banner error">
                ⚠️ Could not load wishlist: {errorMsg}
              </div>
            )}
            {loadState === 'ok' && (
              <AddLinkForm categories={categories} onAddLink={addLink} onAddCategory={addCategory} />
            )}
            {categories.map(cat => (
              <CategorySection
                key={cat}
                name={cat}
                items={Array.isArray(data[cat]) ? data[cat] : []}
                onRemove={(item) => removeLink(cat, item)}
                onPriceChange={(item, price) => changePrice(cat, item, price)}
                canDelete={customCategories.includes(cat)}
                onDeleteCategory={() => deleteCategory(cat)}
              />
            ))}
          </div>
        );
      }

      // --- Mount (wait for Firebase module to be ready) ---
      function mountApp() {
        if (typeof window._fbOnSnapshot === 'function') {
          ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        } else {
          // Firebase module script hasn't finished yet — retry in 50 ms
          setTimeout(mountApp, 50);
        }
      }
      mountApp();
    </script>
  </body>
</html>
